when:
  - event: [push, pull_request, manual]

steps:
  - name: test
    image: ruby:3.3
    environment:
      BUNDLE_PATH: vendor/bundle
      S3_ENDPOINT: https://hel1.your-objectstorage.com
      S3_BUCKET: mavi-ci-cache
      S3_ACCESS_KEY:
        from_secret: cache_access_key
      S3_SECRET_KEY:
        from_secret: cache_secret_key
    commands:
      - ruby -v

      # --- system deps ---
      # ripgrep: pikuri-workspace's Search::Grep probes for `rg` in its
      # constructor and raises when it's missing, so every spec that builds a
      # real coding agent (spec/code/app_spec.rb) dies at Workspace::Extension
      # without it. The ruby:3.3 image doesn't ship rg; ~4s from apt.
      - DEBIAN_FRONTEND=noninteractive apt-get update -qq
      - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ripgrep

      # --- restore the gem cache from Hetzner Object Storage ---
      # Keyed on Gemfile.lock so it auto-busts when deps change. Skipped when
      # no credentials are present (e.g. a fork PR), so such builds still pass.
      - |
        if [ -n "$S3_ACCESS_KEY" ]; then
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc && chmod +x /usr/local/bin/mc
          mc alias set hz "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
          KEY=$(sha256sum Gemfile.lock | cut -c1-16)
          OBJ="hz/$S3_BUCKET/$CI_REPO_NAME/bundle-$KEY.tgz"
          mc cp "$OBJ" bundle.tgz 2>/dev/null && tar xzf bundle.tgz && echo "cache hit" || echo "cache miss"
        else
          echo "no cache credentials - skipping cache"
        fi

      # --- install + test ---
      - bundle install --jobs 4 --retry 3
      - bundle exec rspec

      # --- repopulate the cache on a miss (bundle.tgz only exists on a hit) ---
      - |
        if [ -n "$S3_ACCESS_KEY" ] && [ ! -f bundle.tgz ]; then
          tar czf bundle.tgz vendor/bundle && mc cp bundle.tgz "$OBJ"
        fi
